<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemulihan Saat Session Expired</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Pemulihan Sesi</p>
    <h1>Logika fetch.py saat session kadaluarsa atau diblokir</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-recovery-title flow-recovery-desc">
        <title id="flow-recovery-title">Pemulihan saat session Strava expired</title>
        <desc id="flow-recovery-desc">Diagram alur keputusan fetch.py: jika sesi dialihkan ke halaman login, sistem menandai SESSION_EXPIRED dan meminta login manual satu kali; jika tidak, cookie disinkronkan, data ditarik, dengan fallback in-browser saat Cloudflare memblokir, sebelum data disimpan dan dianalisis menjadi laporan.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- arrows -->
        <line x1="480" y1="88" x2="480" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="316" y="144" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="328" y="153" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YA</text>
        <line x1="376" y1="164" x2="296" y2="164" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="196" y1="192" x2="196" y2="232" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M96,260 L56,260 Q48,260 48,252 L48,72 Q48,64 56,64 L400,64" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="60" y="150" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="112" y="159" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN BERIKUTNYA</text>
        <line x1="480" y1="208" x2="480" y2="248" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="492" y="216" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="512" y="225" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIDAK</text>
        <line x1="480" y1="304" x2="480" y2="336" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="480" y1="392" x2="480" y2="420" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="604" y="444" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="616" y="453" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YA</text>
        <line x1="584" y1="464" x2="664" y2="464" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="480" y1="508" x2="480" y2="540" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="492" y="512" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="512" y="521" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIDAK</text>
        <path d="M764,492 L764,556 Q764,564 756,564 L560,564" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- nodes -->
        <g>
          <rect x="400" y="40" width="160" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
          <text x="480" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">fetch.py jalan</text>
          <text x="480" y="78" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LaunchAgent &#183; tiap 06:30</text>
        </g>
        <polygon points="376,164 480,120 584,164 480,208" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">redirect ke /login?</text>
        <g>
          <rect x="96" y="136" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="196" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tulis SESSION_EXPIRED</text>
          <text x="196" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exit 2 &#183; cron log memberi tahu</text>
        </g>
        <g>
          <rect x="96" y="232" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="196" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">scripts/relogin.sh</text>
          <text x="196" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">login manual 1x &#183; Chrome headful</text>
        </g>
        <g>
          <rect x="400" y="248" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="480" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sync cookie sesi</text>
          <text x="480" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CDP :9222 &#183; session.json</text>
        </g>
        <g>
          <rect x="400" y="336" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="480" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GET ringkasan + file</text>
          <text x="480" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">JSON &#183; FIT &#183; GPX</text>
        </g>
        <polygon points="376,464 480,420 584,464 480,508" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">diblokir Cloudflare?</text>
        <g>
          <rect x="664" y="436" width="200" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="764" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">fetch via browser</text>
          <text x="764" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eval CDP &#183; in-page fetch</text>
        </g>
        <g>
          <rect x="400" y="540" width="160" height="48" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
          <text x="480" y="564" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">data/ + laporan</text>
          <text x="480" y="578" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">analyze.py &#183; reports/latest.md</text>
        </g>
        <!-- editorial callout -->
        <text x="56" y="308" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">*Satu-satunya langkah manual di seluruh sistem:</text>
        <text x="56" y="326" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">login sekali di jendela Chrome yang terbuka.</text>
        <!-- legend -->
        <line x1="32" y1="616" x2="928" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="32" y="636" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>
        <ellipse cx="120" cy="632" rx="16" ry="10" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="636" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">MULAI/SELESAI</text>
        <rect x="280" y="625" width="28" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="316" y="636" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PROSES</text>
        <polygon points="420,632 434,622 448,632 434,642" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="456" y="636" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">KEPUTUSAN</text>
        <line x1="568" y1="632" x2="604" y2="632" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="612" y="636" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">JALUR PEMULIH (MANUAL)</text>
      </svg>
    </div>
  </div>
</body>
</html>
